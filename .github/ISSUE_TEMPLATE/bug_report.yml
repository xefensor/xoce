{
  "name": "Bug report",
  "description": "Report a reproducible problem in XOCE website.",
  "body": [
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "Page URL and source commit",
        "description": "Use the exact version or commit you tested."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "environment",
      "attributes": {
        "label": "Browser, operating system and viewport",
        "description": "Include browser version, device or viewport size, and whether JavaScript was enabled."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reproduction",
      "attributes": {
        "label": "Steps to reproduce",
        "description": "Give the smallest sequence that reproduces the problem."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "result",
      "attributes": {
        "label": "Expected and actual behavior",
        "description": "Describe what you expected and what happened."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Logs or screenshots",
        "description": "Optional. Remove private notification text, media details, tokens and other personal information before sharing."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
